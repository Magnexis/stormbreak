name: Bug report
description: Report reproducible incorrect Stormbreak behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private URLs, or sensitive payloads.
  - type: input
    id: version
    attributes:
      label: Stormbreak version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version and platform
      placeholder: go1.26.3 linux/amd64
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: go
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
